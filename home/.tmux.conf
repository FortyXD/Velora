set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB,foot*:RGB,xterm-256color:RGB"
set -g default-shell /bin/zsh
set -g default-command "/bin/zsh -l"
set -g update-environment "DISPLAY WAYLAND_DISPLAY SSH_AUTH_SOCK XAUTHORITY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE DBUS_SESSION_BUS_ADDRESS PATH SHELL CONDA_EXE CONDA_PREFIX CONDA_DEFAULT_ENV CONDA_SHLVL"
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=default,fg=default"
set -g status-left-length 24
set -g status-right-length 0
set -g status-left-style "fg=cyan,bold"
set -g status-left " #S "
set -g status-right ""
set -g window-status-separator ""
set -g window-status-format ""
set -g window-status-current-format ""
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=cyan"
set -g message-style "bg=default,fg=default,reverse"
set -g mode-style "bg=default,fg=default,reverse"
source-file -qF '#{?XDG_CONFIG_HOME,#{XDG_CONFIG_HOME},#{HOME}/.config}/tmux/velora-theme.conf'
