set -g default-shell /bin/zsh
set -g default-command "/bin/zsh -l"
set -g update-environment "DISPLAY WAYLAND_DISPLAY SSH_AUTH_SOCK XAUTHORITY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE DBUS_SESSION_BUS_ADDRESS PATH SHELL CONDA_EXE CONDA_PREFIX CONDA_DEFAULT_ENV CONDA_SHLVL"
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=default,fg=#6c7086"
set -g status-left-length 24
set -g status-right-length 0
set -g status-left "#[fg=#89b4fa,bold] #S "
set -g status-right ""
set -g window-status-separator ""
set -g window-status-format ""
set -g window-status-current-format ""
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g mode-style "bg=#313244,fg=#89b4fa"
