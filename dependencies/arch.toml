# Velora dependencies: actual repository/AUR packages, no local metapackages.
version = 1

[features.desktop]
description = "Hyprland, Quickshell and desktop portals"
required = true
repo = [
    "kitty",
    "hyprland",
    "hypridle",
    "hyprlock",
    "hyprsunset",
    "quickshell",
    "xdg-desktop-portal",
    "xdg-desktop-portal-hyprland",
    "xdg-desktop-portal-gtk",
    "xdg-desktop-portal-kde",
    "polkit-kde-agent",
    "plasma-integration", # QT_QPA_PLATFORMTHEME=kde
    "breeze-icons", # The shell's themed application and system icons
    "breeze", # Fallback cursor when the optional Bibata theme is absent
]
aur = []

[features.applications]
description = "Terminal, file manager and everyday applications"
required = false
repo = [
    "dolphin",
    "systemsettings",
    "plasma-systemmonitor", # The default task manager action
    "kitty",
    "foot",
    "fuzzel",
    "tmux",
    "zsh",
    "fish",
    "starship",
    "zsh-autosuggestions",
    "fzf",
    "eza",
    "bat",
    "ripgrep",
    "zoxide",
    "breeze",
]
aur = []

[features.shell]
description = "Shell services, media, networking and hardware controls"
required = true
repo = [
    "bc",
    "cliphist",
    "cmake",
    "curl",
    "wget",
    "xdg-user-dirs",
    "rsync",
    "go-yq",
    "geoclue",
    "brightnessctl",
    "ddcutil",
    "glib2",
    "gsettings-desktop-schemas",
    "dconf",
    "file",
    "which",
    "util-linux",
    "kmod", # Loads uinput for the virtual keyboard daemon
    "imagemagick",
    "hyprpicker",
    "songrec",
    "translate-shell",
    "libqalculate",
    "upower",
    "power-profiles-daemon",
    "wtype",
    "ydotool",
    "cava",
    "pavucontrol-qt",
    "wireplumber",
    "pipewire",
    "pipewire-audio", # pw-record/pw-play: microphone tests and recording
    "pipewire-pulse",
    "libpulse", # pactl: move streams between audio devices
    "libdbusmenu-gtk3",
    "playerctl",
    "hyprshot",
    "slurp",
    "swappy",
    "tesseract",
    "tesseract-data-eng",
    "tesseract-data-rus",
    "wf-recorder",
    "clang",
    "uv",
    "gtk4",
    "libadwaita",
    "libsoup3",
    "libportal-gtk4",
    "gobject-introspection",
    "gnome-desktop-4", # GnomeDesktop 4.0 typelib used by thumbnail generation
    "bluedevil",
    "bluez",
    "bluez-utils",
    "bluez-obex", # Sending and receiving files in the Bluetooth settings
    "gnome-keyring",
    "networkmanager",
    "plasma-nm",
    "wl-clipboard",
    "grim",
    "ffmpeg",
    "ffmpegthumbnailer",
    "mpv",
    "jq",
    "python",
    "python-pillow",
    "fish", # The default system-update action invokes fish
    "xkeyboard-config", # Layout names and the keyboard preview
    "qt6-base",
    "qt6-declarative",
    "qt6-svg",
    "qt6-imageformats",
    "qt6-multimedia",
    "qt6-multimedia-ffmpeg",
    "qt6-wayland",
    "qt6-5compat",
    "qt6-positioning",
    "kirigami",
    "syntax-highlighting",
    "libnotify",
    "libsecret",
    "psmisc",
    "xdg-utils",
    "pacman-contrib",
    "matugen",
    "rust", # Builds tools/, which the shell can't reach Wi-Fi and Bluetooth without; rustup also satisfies it
    "qt6-shadertools", # qsb, for the shaders in assets/shaders
    "kdialog",
    "fontconfig",
    "ttf-jetbrains-mono-nerd",
    "ttf-hack-nerd", # Kitty's configured family
    "noto-fonts", # Waffle's Noto Sans and fallback glyphs for translated UI
    "noto-fonts-emoji",
    "kio-extras",
    "kvantum",
    "git",
    "base-devel",
]
# The four UI font families are downloaded and verified by install_fonts, including with --skip-aur.
aur = []

[features.toolbox]
description = "Conversion, downloads, QR codes and OCR"
required = false
repo = [
    "yt-dlp",
    "qrencode",
    "zbar",
    "poppler",
    "qpdf",
    "7zip",
    "pandoc-cli",
    "ghostscript",
    "libheif",
    "kdialog",
]
aur = []

[features.appearance]
description = "Additional fonts and application themes"
required = false
repo = []
aur = [
    "wlogout",
    "adw-gtk-theme-git",
    "breeze-plus",
    "darkly-bin",
    "ttf-rubik-vf",
    "ttf-twemoji",
]

[features.live-wallpapers]
description = "Video wallpaper playback"
required = false
repo = []
aur = ["mpvpaper"]
