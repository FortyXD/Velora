[package]
name = "velora-agentd"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
description = "On-demand, local-first desktop assistant for Velora"

[dependencies]
anyhow = "1"
base64 = "0.22"
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "io-std", "io-util", "net", "sync", "time", "process", "fs", "signal"] }
tempfile = "3"

