[package]
name = "velora-translate"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"
description = "On-demand CPU translation for the Velora sidebar"

# Built by the optional translator installer so the desktop does not link an inference engine.
[workspace]

[dependencies]
anyhow = "1"
ct2rs = { version = "=0.11.2", default-features = false, features = ["ruy", "openmp-runtime-comp"] }
sentencepiece = "0.14"
serde_json = "1"

[target.'cfg(target_arch = "x86_64")'.dependencies]
ct2rs = { version = "=0.11.2", default-features = false, features = ["dnnl"] }

[profile.release]
strip = true
