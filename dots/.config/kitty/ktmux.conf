# Needed for vim-kitty-navigator / kitty-side navigation helpers
allow_remote_control yes
listen_on unix:@mykitty

# Make splits the primary layout
enabled_layouts splits:split_axis=horizontal,stack,tall
map_timeout 1.5

# -------------------------------------------------------------------
# tmux-compatible prefix layer
# repo source:
#   prefix = Ctrl-Space
#   prefix + Ctrl-Space = send prefix
#   prefix + " = horizontal split (top/bottom)
#   prefix + % = vertical split (left/right)
# -------------------------------------------------------------------

# send-prefix equivalent
map ctrl+space>ctrl+space send_key ctrl+space

# split-window -v  => top/bottom split
map ctrl+space>" launch --cwd=current --location=hsplit

# split-window -h  => left/right split
map ctrl+space>% launch --cwd=current --location=vsplit

# -------------------------------------------------------------------
# tmux muscle-memory bindings for kitty tabs/windows
# kitty tab ~= tmux window
# kitty window ~= tmux pane
# -------------------------------------------------------------------

# tmux: prefix c  -> new window
map ctrl+space>c new_tab_with_cwd

# tmux: prefix n / p -> next / previous window
map ctrl+space>n next_tab
map ctrl+space>p previous_tab

# tmux: prefix 1..0 -> window by number
map ctrl+space>1 goto_tab 1
map ctrl+space>2 goto_tab 2
map ctrl+space>3 goto_tab 3
map ctrl+space>4 goto_tab 4
map ctrl+space>5 goto_tab 5
map ctrl+space>6 goto_tab 6
map ctrl+space>7 goto_tab 7
map ctrl+space>8 goto_tab 8
map ctrl+space>9 goto_tab 9
map ctrl+space>0 goto_tab 10

# tmux: prefix , -> rename window
map ctrl+space>, set_tab_title

# tmux: prefix & -> kill window
map ctrl+space>& close_tab

# tmux: prefix x -> kill pane
map ctrl+space>x close_window

# tmux: prefix o -> cycle panes
map ctrl+space>o next_window

# tmux: prefix z -> zoom pane
map ctrl+space>z toggle_layout stack

# tmux: prefix ! -> break pane
map ctrl+space>! detach_window ask

# -------------------------------------------------------------------
# replacement for vim-tmux-navigator
# requires knubie/vim-kitty-navigator and its two kittens:
#   ~/.config/kitty/pass_keys.py
#   ~/.config/kitty/get_layout.py
# -------------------------------------------------------------------

map ctrl+h kitten pass_keys.py left   ctrl+h
map ctrl+j kitten pass_keys.py bottom ctrl+j
map ctrl+k kitten pass_keys.py top    ctrl+k
map ctrl+l kitten pass_keys.py right  ctrl+l

# closest kitty equivalent to vim-tmux-navigator's Ctrl-\ previous split
# this switches to the previously active kitty window
map ctrl+\ nth_window -1
