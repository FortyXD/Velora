$lock_cmd = qs -c ii ipc call lock activate || pidof hyprlock || hyprlock
$suspend_cmd = systemctl suspend || loginctl suspend

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = $lock_cmd
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'; qs -c ii ipc call lock focus
    inhibit_sleep = 3
}

listener {
    timeout = 600 # 10mins
    on-timeout = loginctl lock-session
}

listener {
    timeout = 1800 # 30mins
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 3600 # 60mins
    on-timeout = $suspend_cmd
}
