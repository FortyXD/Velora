# Each device keeps its saved port, volume and mute (WirePlumber's default route restore), and a jack that is
# plugged in still wins over the saved port (folis/prefer-plugged-routes.lua). Turning route restore off, as
# this file used to, also threw away every saved volume: microphones came back at 100 %, which on built-in
# sound cards means the analog boost at maximum (a muffled, booming, noisy mic).
wireplumber.components = [
  {
    name = folis/prefer-plugged-routes.lua, type = script/lua
    provides = custom.prefer-plugged-routes
  }
]

wireplumber.profiles = {
  main = {
    # Optional: without the script, routing falls back to WirePlumber's own rules
    custom.prefer-plugged-routes = optional
  }
}

# A built-in microphone that has no saved volume yet starts at 25 %: the capture gain alone, no boost
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.pci-.*" }
    ]
    actions = {
      update-props = {
        device.routes.default-source-volume = 0.0156
      }
    }
  }
]
