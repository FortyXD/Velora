# Register this server's socket so a wallpaper change can also update detached
# sessions and servers started with -L or -S.
set-option -gF @velora_palette_dir '#{?XDG_STATE_HOME,#{XDG_STATE_HOME},#{HOME}/.local/state}/quickshell/user/generated/terminal'
run-shell 'mkdir -p -- #{q:@velora_palette_dir}/tmux-servers && ln -sfn -- #{q:socket_path} #{q:@velora_palette_dir}/tmux-servers/#{pid}'
source-file -qF '#{@velora_palette_dir}/tmux.conf'
