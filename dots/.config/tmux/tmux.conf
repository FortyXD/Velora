set -g mouse on
set -g history-limit 100000

set -g set-clipboard on
set -s copy-command 'wl-copy'

bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel
bind-key -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel

# Optional mouse-link opening (ordinary click / Ctrl+click, including copy mode).
# Enable in your personal tmux config; this file leaves existing mouse behavior unchanged.
# source-file ~/.config/tmux/mouse-links.conf
