set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB,foot*:RGB,xterm-256color:RGB"
set -g mouse on
set -g history-limit 100000

set -g set-clipboard on
set -s copy-command 'wl-copy'

# Keep the copied text highlighted until the next click or keypress.
bind-key -T copy-mode-vi MouseDragEnd1Pane { send -X copy-pipe-no-clear ; switch-client -T velora-selection }
bind-key -T copy-mode MouseDragEnd1Pane { send -X copy-pipe-no-clear ; switch-client -T velora-selection }
bind-key -T velora-selection Escape copy-mode -q
bind-key -T velora-selection Any { copy-mode -q ; send-keys -K }

# The prefix bypasses the one-key table. Escape and buffer paste still return to input.
bind-key -T prefix Escape if-shell -F '#{selection_present}' { copy-mode -q }
set-hook -g after-paste-buffer[1] { if-shell -F '#{selection_present}' { copy-mode -q } }

# Optional mouse-link opening (ordinary click / Ctrl+click, including copy mode).
# Enable in your personal tmux config; this file leaves existing mouse behavior unchanged.
# source-file ~/.config/tmux/mouse-links.conf
source-file -qF '#{?XDG_CONFIG_HOME,#{XDG_CONFIG_HOME},#{HOME}/.config}/tmux/velora-theme.conf'
