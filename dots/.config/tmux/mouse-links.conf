# Optional HTTP(S) mouse links. Enable explicitly from your tmux config.
# tmux does not know that Kitty speaks OSC 8, and applications only emit
# hyperlinks when their client advertises the feature.
set -as terminal-features ',xterm-kitty:hyperlinks'
# Materialize mouse formats only in run-shell (set-buffer does not expand them).
# q: shell-quotes terminal-controlled values. One process opens at most one URL.
bind -T root C-MouseDown1Pane run-shell -b '"${XDG_CONFIG_HOME:-$HOME/.config}/tmux/scripts/open-link.py" h#{q:mouse_hyperlink} w#{q:mouse_word} l#{q:mouse_line} x#{mouse_x} p#{pane_left} || :'
bind -T root MouseDown1Pane if-shell '"${XDG_CONFIG_HOME:-$HOME/.config}/tmux/scripts/open-link.py" h#{q:mouse_hyperlink} w#{q:mouse_word} l#{q:mouse_line} x#{mouse_x} p#{pane_left}' {} {
    select-pane -t=
    send-keys -M
}
bind -T copy-mode C-MouseDown1Pane run-shell -b '"${XDG_CONFIG_HOME:-$HOME/.config}/tmux/scripts/open-link.py" h#{q:mouse_hyperlink} w#{q:mouse_word} l#{q:mouse_line} x#{mouse_x} p#{pane_left} || :'
bind -T copy-mode-vi C-MouseDown1Pane run-shell -b '"${XDG_CONFIG_HOME:-$HOME/.config}/tmux/scripts/open-link.py" h#{q:mouse_hyperlink} w#{q:mouse_word} l#{q:mouse_line} x#{mouse_x} p#{pane_left} || :'
bind -T copy-mode MouseDown1Pane if-shell '"${XDG_CONFIG_HOME:-$HOME/.config}/tmux/scripts/open-link.py" h#{q:mouse_hyperlink} w#{q:mouse_word} l#{q:mouse_line} x#{mouse_x} p#{pane_left}' {} { select-pane }
bind -T copy-mode-vi MouseDown1Pane if-shell '"${XDG_CONFIG_HOME:-$HOME/.config}/tmux/scripts/open-link.py" h#{q:mouse_hyperlink} w#{q:mouse_word} l#{q:mouse_line} x#{mouse_x} p#{pane_left}' {} { select-pane }
