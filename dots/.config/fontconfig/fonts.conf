<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
    <!-- The integrated terminal uses generic monospace unless a font was chosen.
         Give the Linux Code process a monospace face with the bundled prompt glyphs. -->
    <match target="pattern">
        <test name="prgname"><string>code</string></test>
        <test name="family"><string>monospace</string></test>
        <edit name="family" mode="prepend" binding="strong">
            <string>JetBrainsMono Nerd Font Mono</string>
        </edit>
    </match>
    <match target="font">
        <edit name="rgba" mode="assign">
        <const>none</const>
    </edit>
  </match>
</fontconfig>
