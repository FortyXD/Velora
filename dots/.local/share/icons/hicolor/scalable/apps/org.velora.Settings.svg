<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Velora Settings</title>
  <defs>
    <linearGradient id="background" x2="0.6" y2="1">
      <stop stop-color="#262238"/>
      <stop offset="1" stop-color="#10131e"/>
    </linearGradient>
    <linearGradient id="edge" x2="0" y2="1">
      <stop stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <!-- The V of the Velora banner, in its own coordinates -->
