# Ollama on demand (installed by ollama-on-demand.sh).
# The real server moves to port 11435 and only runs while ollama-proxy.service needs it;
# clients keep using 127.0.0.1:11434, where ollama-proxy.socket listens.
[Unit]
StopWhenUnneeded=yes

[Service]
Environment=OLLAMA_HOST=127.0.0.1:11435
# Unload models from memory soon after the last request
Environment=OLLAMA_KEEP_ALIVE=3m
