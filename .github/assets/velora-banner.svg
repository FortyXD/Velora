<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">Velora</title>
  <desc id="description">A desktop shaped around you. An Arch Linux desktop built with Hyprland and Quickshell.</desc>
  <defs>
    <clipPath id="frame"><rect width="1200" height="300" rx="24"/></clipPath>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#211710"/>
      <stop offset="1" stop-color="#130f0d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffe4c7"/>
      <stop offset="0.55" stop-color="#ffaf66"/>
      <stop offset="1" stop-color="#e66836"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#f18740" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f18740" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#frame)">
  <rect width="1200" height="300" rx="24" fill="url(#background)"/>
  <ellipse cx="985" cy="150" rx="290" ry="240" fill="url(#glow)"/>
  <g fill="none" stroke="#df9b62" stroke-opacity="0.12">
    <circle cx="985" cy="150" r="190"/>
    <circle cx="985" cy="150" r="144"/>
    <circle cx="985" cy="150" r="98"/>
    <path d="M720 150h480M985 0v300"/>
  </g>
  <g font-family="DejaVu Sans, sans-serif">
    <text x="60" y="54" fill="#d3a478" font-size="13" letter-spacing="4">ARCH LINUX DESKTOP</text>
    <text x="56" y="145" fill="#fff1e4" font-size="78" font-weight="700" letter-spacing="-3">Velora</text>
    <text x="60" y="192" fill="#dec3a9" font-size="24">A desktop shaped around you.</text>
    <g fill="#b69a81" font-size="12" letter-spacing="2">
      <text x="60" y="254">HYPRLAND</text>
      <text x="185" y="254" fill="#705442">/</text>
      <text x="215" y="254">QUICKSHELL</text>
      <text x="363" y="254" fill="#705442">/</text>
      <text x="393" y="254">MAKE IT YOURS</text>
    </g>
  </g>
  <path d="M906 100L975 216Q981 226 987 216L1062 86" fill="none" stroke="url(#accent)" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M947 85L981 143" fill="none" stroke="#ffe3c4" stroke-opacity="0.42" stroke-width="9" stroke-linecap="round"/>
  <circle cx="1087" cy="198" r="5" fill="#f7ad62"/>
  <circle cx="872" cy="73" r="3" fill="#d88e4c"/>
  </g>
</svg>
