name: Feature request
description: Suggest an improvement to Velora.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Please search existing Velora issues first. Include your use case and any relevant examples.
  - type: textarea
    attributes:
      label: What would you like to add or change?
    validations:
      required: true
  - type: textarea
    attributes:
      label: How would it help your workflow?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Examples or additional context
