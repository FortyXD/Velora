name: Bug report
description: Report a problem with Velora on Arch Linux.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please search existing issues before reporting a problem. Velora currently supports Arch Linux only.
  - type: textarea
    attributes:
      label: What happened?
      description: Include the steps to reproduce the issue, expected behavior, and actual behavior.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Diagnostics
      description: Run ./velora doctor from the checkout and paste its output. If installation failed, include the failed command and its output.
      render: text
    validations:
      required: true
  - type: textarea
    attributes:
      label: Additional logs or screenshots
      description: For shell problems, include relevant Quickshell output. Remove personal data before sharing logs.
