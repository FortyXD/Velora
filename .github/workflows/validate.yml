name: Validate Velora
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  maintenance-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell entry points
        run: bash -n velora install.sh setup diagnose scripts/install.sh dots/.config/quickshell/ii/scripts/maintenance/velora.sh
      - name: Run isolated installer and updater tests
        run: python3 -m unittest discover -s tests -v
      - name: Test the native helper
        run: |
          cargo test --locked --manifest-path tools/Cargo.toml
          cargo clippy --locked --manifest-path tools/Cargo.toml -- -D warnings
      - name: Validate dependency components
        run: ./velora components
      - name: Preview source-build installation
        run: ./velora install --dry-run --skip-packages --build-package --build-from-source
  connectivity:
    # Qt Quick Test and the real shell runtime against the real daemon, which the job above has no packages for.
    # Nothing here may be skipped: VELORA_REQUIRE_CONNECTIVITY_TESTS turns a missing tool into a failure.
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install what the tests need
        run: pacman -Syu --noconfirm --needed git rust cargo-llvm-cov dbus qt6-declarative qt6-5compat qt6-svg quickshell python ttf-dejavu
      - uses: actions/checkout@v4
      - name: Test the daemon, with at least 90% of its lines covered
        run: cargo llvm-cov --locked --manifest-path tools/Cargo.toml -p velora-connectivityd --fail-under-lines 90
      - name: Test the shell's side of it
        env:
          VELORA_REQUIRE_CONNECTIVITY_TESTS: "1"
        run: |
          python3 -m unittest discover -s tests -p "test_connectivity_qml.py" -v
          python3 -m unittest discover -s tests -p "test_connectivity_pages.py" -v
