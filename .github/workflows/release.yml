name: Build release package
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag to rebuild and prepare as a draft release (optional)'
        required: false
        type: string
permissions:
  contents: read
jobs:
  arch-package:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: write
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed git python sudo github-cli rust
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          submodules: recursive
          fetch-depth: 0
      - name: Create an unprivileged builder
        run: |
          install -d -m 0755 /run/systemd
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Validate maintenance tools
        run: |
          runuser -u builder -- python3 -m unittest discover -s tests -v
          bash -n velora install.sh setup diagnose scripts/install.sh dots/.config/quickshell/ii/scripts/maintenance/velora.sh
      - name: Build the Velora package
        run: runuser -u builder -- ./velora package --output "$GITHUB_WORKSPACE/dist"
      - name: Check package contents and generate checksums
        run: |
          pacman -Qip dist/velora-*.pkg.tar.zst
          pacman -Qlp dist/velora-*.pkg.tar.zst
          sha256sum dist/velora-*.pkg.tar.zst > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: velora-arch-package
          path: |
            dist/*.pkg.tar.zst
            dist/SHA256SUMS
      - name: Publish package to GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/velora-*.pkg.tar.zst dist/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Velora $RELEASE_TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$RELEASE_TAG" dist/velora-*.pkg.tar.zst dist/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "Velora $RELEASE_TAG" --notes-file RELEASE_NOTES.md
          fi
